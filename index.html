<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
    <title>CarreloSpessa</title>
</head>

<body class="bg-light">

    <div class=" row  text-center  justify-content-center  ">
        <div class="col-6 bg-white mt-5 pt-3 rounded-4 ">
            <h1 class="fw-bold"> 🛒
                Il mio carrelo</h1>
            <p>Aggiungi un prodotto al carrelo.</p>

            <form> <input class="py-2 px-4 my-2 text-center" id="prezzo" type="number"
                    placeholder="insersci prezzo"></input></form>
            <button onclick="AggiungiProdotto()" class="btn btn-dark">
                Aggiungi prodotto
            </button>
            <button onclick="Reset()" class="btn btn-danger">Reset</button>
            <div class="bg-light my-4 p-4 rounded-4">
                <p>Totale:</p>
                <h4 id="tot" class="text-primary fw-bold">0 €</h4>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>

</body>

</html>
